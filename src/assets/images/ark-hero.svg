<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <style>
      .hull-thick { fill: none; stroke: #ffffff; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .hull-med   { fill: none; stroke: #ffffff; stroke-opacity: .88; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .hull-thin  { fill: none; stroke: #E9D5AC; stroke-opacity: .8; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .deck-post  { fill: none; stroke: #E9D5AC; stroke-opacity: .85; stroke-width: 1.4; stroke-linecap: round; }
    </style>
  </defs>

  <g id="ark-graphic" transform="translate(40, 20)">
    <!-- 1. Cabin Roof -->
    <path class="hull-thick" d="M 390 145 L 945 200 L 965 240 L 450 185 Z" />
    <path class="hull-med" d="M 335 205 L 390 145 L 450 185 Z" />
    <line class="hull-thin" x1="390" y1="145" x2="390" y2="185" />
    <line class="hull-thin" x1="330" y1="210" x2="455" y2="188" />
    <line class="hull-thin" x1="455" y1="188" x2="975" y2="242" />

    <!-- 2. Cabin Structure -->
    <path class="hull-med" d="M 345 208 L 440 188 L 440 270 L 360 266 L 360 235 Z" />
    <line class="hull-thin" x1="360" y1="235" x2="440" y2="215" />
    <line class="hull-thin" x1="360" y1="250" x2="440" y2="240" />

    <path class="hull-med" d="M 440 188 L 950 238 L 938 288 L 440 270 Z" />

    <!-- Cabin Siding Planks -->
    <line class="hull-thin" x1="440" y1="208" x2="948" y2="250" />
    <line class="hull-thin" x1="440" y1="228" x2="945" y2="262" />
    <line class="hull-thin" x1="440" y1="248" x2="942" y2="275" />

    <!-- Windows & Door -->
    <rect class="hull-med" x="490" y="215" width="42" height="32" rx="1" />
    <line class="hull-thin" x1="504" y1="215" x2="504" y2="247" />
    <line class="hull-thin" x1="518" y1="215" x2="518" y2="247" />

    <rect class="hull-med" x="605" y="226" width="42" height="32" rx="1" />
    <line class="hull-thin" x1="619" y1="226" x2="619" y2="258" />
    <line class="hull-thin" x1="633" y1="226" x2="633" y2="258" />

    <path class="hull-med" d="M 720 277 L 720 237 L 755 240 L 755 280 Z" />

    <rect class="hull-med" x="825" y="247" width="40" height="30" rx="1" />
    <line class="hull-thin" x1="838" y1="247" x2="838" y2="277" />
    <line class="hull-thin" x1="852" y1="247" x2="852" y2="277" />

    <!-- 3. Deck Railings -->
    <path class="hull-thick" d="M 125 240 C 370 252, 760 270, 1075 260" />
    <path class="hull-med" d="M 122 254 C 370 265, 760 282, 1078 273" />

    <g class="deck-post">
      <line x1="150" y1="241" x2="150" y2="255" />
      <line x1="180" y1="242" x2="180" y2="256" />
      <line x1="210" y1="243" x2="210" y2="257" />
      <line x1="240" y1="244" x2="240" y2="258" />
      <line x1="270" y1="246" x2="270" y2="260" />
      <line x1="300" y1="247" x2="300" y2="261" />
      <line x1="330" y1="249" x2="330" y2="263" />
      <line x1="360" y1="250" x2="360" y2="264" />
      <line x1="390" y1="252" x2="390" y2="266" />
      <line x1="420" y1="254" x2="420" y2="268" />
      <line x1="455" y1="256" x2="455" y2="270" />
      <line x1="490" y1="258" x2="490" y2="272" />
      <line x1="525" y1="260" x2="525" y2="274" />
      <line x1="560" y1="261" x2="560" y2="276" />
      <line x1="595" y1="263" x2="595" y2="277" />
      <line x1="630" y1="264" x2="630" y2="278" />
      <line x1="665" y1="265" x2="665" y2="279" />
      <line x1="700" y1="266" x2="700" y2="280" />
      <line x1="735" y1="267" x2="735" y2="281" />
      <line x1="770" y1="267" x2="770" y2="281" />
      <line x1="805" y1="267" x2="805" y2="281" />
      <line x1="840" y1="266" x2="840" y2="280" />
      <line x1="875" y1="265" x2="875" y2="279" />
      <line x1="910" y1="264" x2="910" y2="277" />
      <line x1="945" y1="263" x2="945" y2="276" />
      <line x1="980" y1="262" x2="980" y2="275" />
      <line x1="1015" y1="261" x2="1015" y2="274" />
      <line x1="1050" y1="260" x2="1050" y2="273" />
    </g>

    <!-- 4. Bow & Stern Posts -->
    <path class="hull-thick" d="M 80 185 L 140 195 L 122 265 L 80 185 Z" />
    <line class="hull-thin" x1="92" y1="200" x2="132" y2="208" />
    <path class="hull-thick" d="M 1030 274 C 1030 242, 1050 226, 1068 226 C 1084 226, 1088 242, 1088 270 Z" />

    <!-- 5. Main Hull Contours -->
    <path class="hull-thick" d="M 82 195 C 105 410, 150 535, 280 570 C 470 600, 830 590, 985 550 C 1065 525, 1100 440, 1088 270" />
    <path class="hull-med" d="M 122 265 C 138 415, 175 515, 285 548 C 470 575, 820 568, 965 533 C 1040 505, 1075 430, 1080 275" />

    <!-- Horizontal Hull Planks -->
    <path class="hull-thin" d="M 124 290 C 370 310, 760 330, 1072 305" />
    <path class="hull-thin" d="M 128 318 C 370 340, 760 360, 1065 335" />
    <path class="hull-thin" d="M 134 346 C 370 370, 760 390, 1056 365" />
    <path class="hull-thin" d="M 142 376 C 370 400, 760 420, 1045 395" />
    <path class="hull-thin" d="M 152 406 C 370 430, 760 450, 1030 425" />
    <path class="hull-thin" d="M 165 436 C 370 460, 760 480, 1010 455" />
    <path class="hull-thin" d="M 182 466 C 370 490, 760 506, 985 485" />
    <path class="hull-thin" d="M 205 496 C 370 518, 760 532, 955 512" />
    <path class="hull-thin" d="M 238 524 C 380 545, 730 554, 910 535" />

    <!-- Keel Contour -->
    <path class="hull-med" d="M 150 410 C 170 505, 240 558, 350 565 C 600 575, 840 565, 990 533" />
  </g>
</svg>

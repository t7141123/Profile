<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Copy your code</title>
<style>
  :root { --bg:#f4f4f2; --card:#fff; --ink:#18181b; --muted:#6b6b72; --line:#e6e6e3; --box:#f1eefb; --boxline:#e3dcf7; --btn:#18181b; --btntext:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111113; --card:#1b1b1f; --ink:#f4f4f5; --muted:#a1a1aa; --line:#2c2c32; --box:#25213a; --boxline:#3a3361; --btn:#f4f4f5; --btntext:#18181b; }
  }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding:16px; box-sizing:border-box; }
  main { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px; box-sizing:border-box; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { margin:0 0 16px; color:var(--muted); font-size:14px; }
  #code { display:block; width:100%; box-sizing:border-box; text-align:center; font:700 32px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing:6px; padding:16px 8px; background:var(--box); border:1px solid var(--boxline); border-radius:12px; color:var(--ink); user-select:all; }
  button { margin-top:16px; width:100%; padding:12px 16px; border:0; border-radius:10px; background:var(--btn); color:var(--btntext); font:600 15px/1 inherit; cursor:pointer; }
  button:focus-visible { outline:2px solid #6d5bd0; outline-offset:2px; }
  #status { min-height:20px; margin:12px 0 0; text-align:center; font-size:14px; }
  a { color:var(--muted); }
  footer { margin-top:24px; font-size:12px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Your verification code</h1>
  <p>Tap the button to copy it, then go back to the app and paste it.</p>
  <output id="code" aria-live="polite">------</output>
  <button id="copy" type="button">Copy code</button>
  <div id="status" role="status"></div>
  <footer>The code is read from this link and never sent to our servers.<br><a href="https://ark-studio.app">ark-studio.app</a></footer>
</main>
<script>
(function () {
  var raw = (location.hash || '').replace(/^#/, '');
  var code = /^[0-9]{4,10}$/.test(raw) ? raw : '';
  var out = document.getElementById('code');
  var status = document.getElementById('status');
  var btn = document.getElementById('copy');
  if (!code) { out.textContent = '------'; btn.disabled = true; status.textContent = 'No code found in this link. Open it from the email again.'; return; }
  out.textContent = code;
  function done(ok) { status.textContent = ok ? 'Copied. Paste it in the app.' : 'Could not copy automatically. Select the code above and copy it.'; }
  function legacy() {
    var r = document.createRange(); r.selectNodeContents(out);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    try { return document.execCommand('copy'); } catch (e) { return false; }
  }
  function copy() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(function () { done(true); }, function () { done(legacy()); });
    } else { done(legacy()); }
  }
  btn.addEventListener('click', copy);
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  copy();
})();
</script>
</body>
</html>
